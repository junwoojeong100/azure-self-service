name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-container-app
  cancel-in-progress: false

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: ${{ vars.AZURE_CONTAINER_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_RESOURCE_GROUP \
            AZURE_CONTAINER_REGISTRY_NAME \
            AZURE_CONTAINER_APP_NAME \
            IMAGE_NAME
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing production environment variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable container image
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
        run: |
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          az acr login --name "$ACR_NAME"
          docker build --tag "$ACR_LOGIN_SERVER/${IMAGE_NAME}:${GITHUB_SHA}" .
          docker push "$ACR_LOGIN_SERVER/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Deploy a new Container Apps revision
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name app \
            --image "$ACR_LOGIN_SERVER/${IMAGE_NAME}:${GITHUB_SHA}" \
            --set-env-vars "APP_RELEASE=${GITHUB_SHA}" "APP_ENVIRONMENT=production"
          az containerapp ingress update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --target-port 8000 \
            --output none

      - name: Show deployed URL
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          FQDN="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)"
          echo "Application URL: https://${FQDN}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "https://${FQDN}/healthz"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
